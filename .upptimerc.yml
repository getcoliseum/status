# Upptime config for getcoliseum/status (public). Free: GitHub Actions + GitHub Pages. MIT licence (upptime/upptime).
# Holds only uptime results for public pages. No secrets, no customer data.
owner: getcoliseum
repo: status

# Set icon on every site: without it Upptime loads favicons from icons.duckduckgo.com (a third party).
sites:
  - name: Website
    url: https://getcoliseum.com/
    icon: https://status.getcoliseum.com/favicon.svg
  - name: Join the test
    url: https://getcoliseum.com/join/
    icon: https://status.getcoliseum.com/favicon.svg

status-website:
  cname: status.getcoliseum.com
  name: Coliseum status
  introTitle: "Coliseum status"
  introMessage: "Live checks of Coliseum's public pages, run every few minutes."
  # Coliseum brand theme (assets/coliseum.css). Fonts and logos are self-hosted; no third-party requests.
  # Full same-origin URLs on purpose: the export crawler turns root paths into 404 folders, which breaks the asset copy.
  themeUrl: https://status.getcoliseum.com/coliseum.css
  logoUrl: https://status.getcoliseum.com/coliseum-logo.svg
  logoHref: /
  faviconSvg: https://status.getcoliseum.com/favicon.svg
  favicon: https://status.getcoliseum.com/apple-touch-icon.png
  navbar:
    - title: Status
      href: /
    - title: getcoliseum.com
      href: https://getcoliseum.com/

# No issue assignees: nobody is notified by GitHub mentions.
assignees: []
